version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - frontend
      - build

formatters:
  enable:
    - gofmt
    - goimports
