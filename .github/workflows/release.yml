name: Release

# Publication d'une version (Phase 5) : poser une étiquette vX.Y.Z.
# Installateurs Windows (NSIS), application macOS zippée, binaire Linux.
# Signature : appliquée seulement si les secrets du certificat existent
# (voir docs/adr/0009-profils-sauvegarde-distribution.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      WAILS_TAGS: ${{ startsWith(matrix.os, 'ubuntu') && 'webkit2_41' || '' }}
      VERSION: ${{ github.ref_name }}
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Dépendances Linux (GTK, WebKit)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: NSIS
        if: startsWith(matrix.os, 'windows')
        run: choco install nsis -y --no-progress

      - name: wails build
        shell: bash
        run: |
          NSIS=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then NSIS="-nsis"; fi
          wails build -clean $NSIS -trimpath -ldflags "-s -w" ${WAILS_TAGS:+-tags $WAILS_TAGS}

      - name: Signature Windows (si certificat)
        if: startsWith(matrix.os, 'windows') && env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          foreach ($f in Get-ChildItem build\bin\*.exe) {
            & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item cert.pfx

      - name: Taille de l'installateur < 15 Mo (NF-04)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          size=$(stat -c %s build/bin/Dactylo-amd64-installer.exe)
          echo "Installateur : $size octets"
          test "$size" -lt 15728640

      - name: Paquets
        shell: bash
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            Windows) cp build/bin/Dactylo-amd64-installer.exe "dist/Dactylo-$VERSION-windows-amd64-installer.exe" ;;
            macOS) (cd build/bin && ditto -c -k --keepParent "$(ls -d *.app | head -1)" "../../dist/Dactylo-$VERSION-macos.zip") ;;
            Linux) tar -czf "dist/Dactylo-$VERSION-linux-amd64.tar.gz" -C build/bin dactylo ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: dist/

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Version GitHub (brouillon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
